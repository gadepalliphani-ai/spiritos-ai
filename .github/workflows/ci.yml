name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: crates/spiritos-x86_64
        run: |
          cargo build \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem \
            --target x86_64-unknown-none
      - uses: actions/upload-artifact@v4
        with:
          name: spiritos-x86_64
          path: target/x86_64-unknown-none/debug/spiritos-x86_64

  build-aarch64:
    name: Build aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none-softfloat
          components: rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: crates/spiritos-aarch64
        run: |
          cargo build \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem \
            --target aarch64-unknown-none-softfloat
      - uses: actions/upload-artifact@v4
        with:
          name: spiritos-aarch64
          path: target/aarch64-unknown-none-softfloat/debug/spiritos-aarch64

  qemu-x86_64:
    name: QEMU x86_64
    runs-on: ubuntu-latest
    needs: build-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y qemu-system-x86 2>&1 | tail -5
      - name: Build
        working-directory: crates/spiritos-x86_64
        run: |
          cargo build \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem \
            --target x86_64-unknown-none
      - name: QEMU boot test
        run: |
          timeout 8 qemu-system-x86_64 \
            -kernel target/x86_64-unknown-none/debug/spiritos-x86_64 \
            -serial stdio -display none -no-reboot -m 128M 2>&1 | tee boot-x86.log || true
          cat boot-x86.log
          grep -qi "spiritos" boot-x86.log && echo "✅ Boot OK" || echo "⚠️ No output (may need multiboot header)"

  qemu-aarch64:
    name: QEMU aarch64
    runs-on: ubuntu-latest
    needs: build-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none-softfloat
          components: rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y qemu-system-arm 2>&1 | tail -5
      - name: Build
        working-directory: crates/spiritos-aarch64
        run: |
          cargo build \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem \
            --target aarch64-unknown-none-softfloat
      - name: QEMU boot test
        run: |
          timeout 8 qemu-system-aarch64 \
            -M virt -cpu cortex-a53 -m 128M \
            -kernel target/aarch64-unknown-none-softfloat/debug/spiritos-aarch64 \
            -serial stdio -display none -no-reboot 2>&1 | tee boot-arm.log || true
          cat boot-arm.log
          grep -qi "spiritos" boot-arm.log && echo "✅ Boot OK" || echo "⚠️ No output yet"
